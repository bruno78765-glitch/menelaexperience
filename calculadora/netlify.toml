# Usado quando o "Base directory" do site na Netlify é "calculadora".
# As variáveis VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY ficam em Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
