<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icone-asterion.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c1030" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Asterion · A Vila dos Vídeos (@mundoasterion)</title>
    <meta
      name="description"
      content="Jogo 3D low-poly multiplayer assíncrono no navegador onde cada seguidor da @mundoasterion tem sua própria casa, nome e profissão."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0c1030] text-[#f2ead8] overflow-hidden select-none">
    <!-- O canvas 3D do Three.js fica fora da árvore do React -->
    <canvas
      id="asterion-canvas"
      aria-label="Vila 3D de Asterion"
      class="fixed inset-0 w-screen h-screen block cursor-grab active:cursor-grabbing"
    ></canvas>

    <!-- Árvore React exclusiva para HUD, menus, mercado, votação, loja e painel /admin -->
    <div id="hud-root" class="fixed inset-0 pointer-events-none z-10"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
